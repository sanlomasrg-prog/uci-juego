<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0;background:#0a0e13}</style>
<title>Unidad de Ciberinvestigación</title>
<meta name="theme-color" content="#0a0e13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* Teléfono de servicio UCI: tinta azulada, un solo acento ámbar (señal policial).
   Diseño oscuro a propósito: es la pantalla de un teléfono, no una página. */
:root {
  --bg: #0a0e13;
  --surface: #11171f;
  --surface2: #18202a;
  --line: #243040;
  --text: #e8edf2;
  --dim: #8a97a6;
  --faint: #566272;
  --amber: #f2a23a;
  --amber-ink: #1a1204;
  --steel: #6aa9d8;
  --sage: #6fbf9a;
  --red: #e5575c;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui);
  font-size: 15px; line-height: 1.4; overflow: hidden; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--font-mono); }

.stage { height: 100%; display: flex; align-items: center; justify-content: center; }
.phone { position: relative; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
@media (min-width: 600px) {
  .stage { padding: 16px; box-sizing: border-box; background: #05070a; }
  .phone { max-width: 400px; max-height: 820px; border-radius: 38px; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
}

/* barra de estado */
.statusbar {
  position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 var(--gutr) 0 var(--gut); font: 600 13px var(--font-ui); pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.sb-r { display: flex; align-items: center; gap: 7px; }
.sb-r svg { width: 16px; height: 12px; fill: var(--text); }
.batt { width: 16px; height: 9px; border: 1.5px solid var(--text); border-radius: 3px; padding: 1px; box-sizing: content-box; position: relative; }
.batt i { display: block; height: 100%; width: 12px; border-radius: 1px; background: var(--text); }
#sbBat { font: 500 11px var(--font-mono); color: var(--dim); }

/* capas */
.screen, .applayer { position: absolute; left: 0; right: 0; top: 34px; bottom: 0; }
.applayer { pointer-events: none; z-index: 10; }
.applayer > .app { pointer-events: auto; }
.screen {
  background:
    radial-gradient(120% 55% at 85% 0%, #1b2636 0%, transparent 62%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 4px),
    linear-gradient(#0a0e13, #0c121a);
}

/* inicio */
.home { height: 100%; display: flex; flex-direction: column; gap: 18px; padding: 10px var(--gutr) 34px var(--gut); box-sizing: border-box; }
.h-clock { padding-top: 6px; }
.h-time { font: 300 64px/1 var(--font-ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.h-date { color: var(--dim); margin-top: 4px; }
.h-date::first-letter { text-transform: uppercase; }
.h-case { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; box-sizing: border-box; }
.h-case-k { font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.h-case-t { font-weight: 600; font-size: 16px; }
.h-case-s { color: var(--dim); font-size: 13px; }
.h-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 4px 0 2px; }
.h-bar i { display: block; height: 100%; background: var(--amber); transition: width .4s; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; }
.dock { margin-top: auto; display: flex; justify-content: space-around; padding: 12px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.tile-ico { position: relative; width: 56px; height: 56px; border-radius: 16px; background: var(--surface2); border: 1px solid var(--line); display: grid; place-items: center; }
.tile-ico .ico { width: 26px; height: 26px; }
.hue-amber { color: var(--amber); } .hue-steel { color: var(--steel); } .hue-sage { color: var(--sage); }
.hue-rose { color: #d98aa0; } .hue-sand { color: #cdb883; } .hue-dim { color: var(--dim); } .hue-off { color: var(--faint); opacity: .7; }
.tile-name { font-size: 12px; color: var(--dim); }
.badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--amber); color: var(--amber-ink); font: 700 11px/18px var(--font-ui); text-align: center; }

/* avisos */
.banner {
  position: absolute; z-index: 40; top: 38px; left: 10px; right: 10px; display: flex; gap: 10px; align-items: center; padding: 10px 12px;
  background: rgba(24, 32, 42, .97); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  transform: translateY(-150%); transition: transform .3s ease; width: auto; box-sizing: border-box;
}
.banner.show { transform: translateY(0); }
.b-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; color: var(--amber); flex: none; }
.b-txt { display: flex; flex-direction: column; min-width: 0; font-size: 13px; }
.b-txt b { font-size: 13px; }
.b-txt span { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast {
  position: absolute; z-index: 40; left: 50%; bottom: 46px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; max-width: 86%;
  background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; text-align: center; transition: .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.gesture { position: absolute; z-index: 35; left: 0; right: 0; bottom: 0; height: 26px; display: grid; place-items: center; width: 100%; }
.gesture span { width: 110px; height: 4px; border-radius: 2px; background: var(--text); opacity: .55; }

/* arranque */
.su { height: 100%; display: flex; flex-direction: column; padding: 24px var(--gutr) 40px var(--gut); box-sizing: border-box; gap: 16px; }
.su-center { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.su-logo { font: 600 54px/1 var(--font-mono); letter-spacing: .14em; color: var(--amber); padding-left: .14em; }
.su-sub { color: var(--dim); }
.su-fine { color: var(--faint); font: 12px var(--font-mono); margin-top: 6px; }
.su-load { width: 140px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 14px; }
.su-load i { display: block; height: 100%; width: 100%; background: var(--amber); transform-origin: left; animation: load 2.1s ease-out forwards; }
@keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.su-body { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-top: 40px; overflow-y: auto; }
.su-h { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.su-p { margin: 0; color: var(--dim); max-width: 34ch; }
.su-label { margin-top: 18px; font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.su-input { background: var(--surface); border: 1px solid var(--line); color: var(--text); font: 500 18px var(--font-ui); padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; }
.su-btn { background: var(--amber); color: var(--amber-ink); font-weight: 700; text-align: center; padding: 15px; border-radius: 14px; }
.su-btn:disabled { background: var(--surface2); color: var(--faint); cursor: default; }
.su-opts { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.su-opt { display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.su-opt:has(input:checked) { border-color: var(--amber); }
.su-opt input { accent-color: var(--amber); margin-top: 4px; }
.su-opt b { display: block; }
.su-opt i { font-style: normal; color: var(--dim); font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
<style>
/* Estilos de las apps: contenedor, listas, mensajes, evidencia, notas y ajustes. */
.app {
  position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); padding-bottom: 26px; box-sizing: border-box;
  transform: translateY(24px); opacity: 0; transition: transform .22s ease, opacity .22s ease;
}
.app.in { transform: none; opacity: 1; }
.app-h { display: flex; align-items: center; gap: 12px; padding: 8px var(--gutr) 12px var(--gut); border-bottom: 1px solid var(--line); flex: none; }
.app-h h2 { margin: 0; font-size: 18px; font-weight: 600; min-width: 0; }
.h-who { display: flex; flex-direction: column; min-width: 0; }
.h-who span { color: var(--dim); font-size: 12px; }
.back { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; margin-left: -8px; color: var(--text); }
.back:hover { background: var(--surface2); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px var(--gutr) 20px var(--gut); }
.empty { color: var(--dim); margin: 28px 0; max-width: 32ch; }
.grp { margin: 18px 0 6px; font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.hint { color: var(--faint); margin: 0; }

/* filas */
.row { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-top, .row-bot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.row-top time { color: var(--faint); font: 11px var(--font-mono); }
.prev { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.typ { color: var(--amber); font-style: normal; }
.unread { min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: var(--amber); color: var(--amber-ink); font: 700 12px/20px var(--font-ui); text-align: center; flex: none; }
.new { font: 700 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; background: var(--amber); color: var(--amber-ink); padding: 2px 6px; border-radius: 4px; flex: none; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 22%, var(--surface)); color: var(--c); font: 600 14px var(--font-ui); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.ev-ico { width: 40px; height: 40px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--steel); flex: none; }

/* burbujas */
.msgs { display: flex; flex-direction: column; gap: 6px; padding-top: 14px; }
.b { max-width: 82%; padding: 8px 12px 6px; border-radius: 16px; font-size: 15px; word-wrap: break-word; overflow-wrap: anywhere; }
.b time { display: block; margin-top: 2px; font: 10px var(--font-mono); opacity: .6; text-align: right; }
.b.them { align-self: flex-start; background: var(--surface2); border-bottom-left-radius: 4px; }
.b.me { align-self: flex-end; background: var(--amber); color: var(--amber-ink); border-bottom-right-radius: 4px; }
.b.vic { align-self: flex-end; background: #1d3346; border-bottom-right-radius: 4px; }
.b.typing { display: flex; gap: 4px; padding: 12px 14px; }
.b.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: dot 1s infinite; }
.b.typing i:nth-child(2) { animation-delay: .15s; } .b.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
.composer { flex: none; border-top: 1px solid var(--line); padding: 10px var(--gutr) 8px var(--gut); background: var(--surface); }
.composer-off { padding: 12px 14px; border-radius: 20px; background: var(--bg); color: var(--faint); font-size: 14px; }
.choice-k { margin: 0 0 8px; font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { padding: 12px 14px; border: 1px solid var(--amber); border-radius: 14px; color: var(--amber); font-weight: 500; }
.choice:hover, .choice:active { background: var(--amber); color: var(--amber-ink); }

/* evidencia */
.detail { padding-top: 14px; }
.meta { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.meta > div { display: flex; justify-content: space-between; gap: 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.meta > div:last-child { border-bottom: 0; }
.meta dt { color: var(--dim); font-size: 13px; flex: none; }
.meta dd { margin: 0; text-align: right; font: 500 13px var(--font-mono); min-width: 0; overflow-wrap: anywhere; }
.doc-p { margin: 0 0 12px; max-width: 60ch; }
.photo { margin: 0 0 18px; }
.photo-svg { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); }
.photo-img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); }
.photo figcaption { margin-top: 8px; color: var(--text); font-size: 14px; }
.photo .mono { display: block; margin-top: 4px; font-size: 11px; color: var(--faint); }
.chat-head { display: flex; flex-direction: column; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.chat-head .mono { font-size: 11px; color: var(--faint); }
.chat-body { display: flex; flex-direction: column; gap: 6px; }
.sys { align-self: center; margin: 10px 0 0; color: var(--faint); font-size: 12px; text-align: center; }
.calls .call { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.call-d { width: 28px; text-align: center; color: var(--sage); font-size: 18px; }
.call.missed .call-d, .call.missed .call-s { color: var(--red); }
.call-n { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.call-n i { font-style: normal; color: var(--dim); font-size: 12px; }
.call-s { font-size: 12px; color: var(--dim); }
.audio { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; flex-wrap: wrap; }
.play { width: 44px; height: 44px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; flex: none; }
.wave { flex: 1; min-width: 120px; height: 40px; display: flex; align-items: center; gap: 2px; }
.wave i { flex: 1; background: var(--line); border-radius: 1px; }
.wave i.on { background: var(--amber); }
.audio .mono { font-size: 11px; color: var(--dim); }
.transcript { margin-top: 14px; padding: 12px 14px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.transcript p { margin: 0; }
.ok-line { display: flex; gap: 8px; align-items: center; color: var(--sage); margin: 0 0 6px; font-size: 14px; }

/* PIN */
.pin { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 8px; }
.pin-lock { width: 52px; height: 52px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center; color: var(--amber); }
.pin-t { margin: 0; color: var(--dim); font: 12px var(--font-mono); }
.dots { display: flex; gap: 14px; height: 14px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--dim); }
.dots i.on { background: var(--amber); border-color: var(--amber); }
.dots.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pin-m { margin: 0; min-height: 20px; color: var(--dim); font-size: 13px; }
.keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; margin-top: 4px; }
.key { height: 60px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line); text-align: center; font: 500 22px var(--font-ui); }
.key:active { background: var(--amber); color: var(--amber-ink); }

/* notas */
.objs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.objs li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.objs li.done { color: var(--faint); text-decoration: line-through; }
.tick { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--faint); display: grid; place-items: center; flex: none; color: var(--amber-ink); }
.done .tick { background: var(--sage); border-color: var(--sage); }
.tick .ico { width: 14px; height: 14px; stroke-width: 3; }
.clue { padding: 12px 14px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.clue.starred { border-color: var(--amber); }
.clue-t { display: flex; gap: 10px; align-items: flex-start; }
.clue-t p { margin: 0; flex: 1; min-width: 0; }
.star { color: var(--faint); width: 30px; height: 30px; display: grid; place-items: center; margin: -4px -6px 0 0; border-radius: 8px; }
.starred .star { color: var(--amber); }
.starred .star .ico { fill: var(--amber); }
.src { display: inline-block; margin-top: 8px; font: 600 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }

/* ajustes */
.set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.set.col { flex-direction: column; align-items: stretch; }
.set > span { color: var(--dim); font-size: 13px; }
.seg { display: flex; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.seg button { flex: 1; text-align: center; padding: 9px; border-radius: 9px; color: var(--dim); }
.seg button.on { background: var(--amber); color: var(--amber-ink); font-weight: 600; }
.fine { margin: 0; color: var(--dim); font-size: 13px; }
.fine.warn { color: var(--red); }
.fine.ver { margin-top: 18px; font: 11px var(--font-mono); color: var(--faint); }
.btn { padding: 11px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); text-align: center; }
.btn.danger { background: var(--red); border-color: var(--red); color: #1a0506; font-weight: 600; }
.btn.danger-o { border-color: var(--red); color: var(--red); }
.row-btns { display: flex; gap: 10px; margin-top: 10px; }
.row-btns .btn { flex: 1; }

/* terminal */
.shell { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #06090d; }
.term { font: 13px/1.55 var(--font-mono); padding-top: 12px; }
.ln { white-space: pre-wrap; overflow-wrap: anywhere; color: #c9d4df; }
.ln.dim { color: var(--faint); } .ln.cmd { color: var(--dim); margin-top: 8px; }
.ln.ok { color: var(--sage); } .ln.warn { color: var(--amber); } .ln.err { color: var(--red); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px var(--gutr) 8px var(--gut); border-top: 1px solid var(--line); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 12px var(--font-mono); padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--sage); background: var(--surface); }
.chip:active { background: var(--sage); color: var(--bg); }
.term-in { display: flex; align-items: center; gap: 8px; padding: 6px var(--gutr) 6px var(--gut); border-top: 1px solid var(--line); background: var(--surface); }
.term-in:focus-within { border-top-color: var(--sage); }
.ps { font: 600 13px var(--font-mono); color: var(--sage); }
.term-in input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font: 14px var(--font-mono); padding: 10px 0; outline: 0; }
.send { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--sage); }
.send .ico { width: 16px; height: 16px; fill: currentColor; stroke: none; }

/* minijuego: ordenar fragmentos */
.pz { padding-top: 14px; }
.pz[hidden] { display: none; }
.pz-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pz-head b { font-size: 16px; }
.pz-p { color: var(--dim); font-size: 14px; margin: 8px 0 14px; max-width: 52ch; }
.slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: s; }
.slots li { counter-increment: s; position: relative; min-height: 36px; border: 1px dashed var(--line); border-radius: 12px; display: flex; align-items: center; padding-left: 34px; }
.slots li::before { content: counter(s); position: absolute; left: 11px; font: 600 12px var(--font-mono); color: var(--faint); }
.slots li.filled { border: 1px solid var(--sage); background: var(--surface); padding-left: 34px; }
.slots .ph { color: var(--faint); font-size: 13px; padding: 7px 0; }
.pool { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.fr { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); text-align: left; box-sizing: border-box; }
.slots .fr { background: none; border: 0; padding: 8px 12px 8px 0; }
.fr-w { font: 600 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--steel); }
.fr-x { flex: 1 1 100%; font-size: 14px; }
.fr-t { font: 11px var(--font-mono); color: var(--amber); }
.pz-m { min-height: 20px; margin: 12px 0 0; color: var(--amber); font-size: 13px; }
.pz-act { display: flex; gap: 10px; margin-top: 14px; padding-bottom: 8px; }
.pz-act .btn { flex: 1; }
.btn.go { background: var(--sage); border-color: var(--sage); color: #06130d; font-weight: 700; }
.btn.go:disabled { background: var(--surface2); border-color: var(--line); color: var(--faint); cursor: default; }

.shot { position: relative; }
.shot .stamp { position: absolute; left: 10px; bottom: 9px; font: 500 10px var(--font-mono); letter-spacing: .04em; color: #f3d9a0; text-shadow: 0 1px 3px #000; }

/* minijuego: ajustar filtros */
.crop { position: relative; width: 100%; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: #000; }
.crop-i { position: absolute; inset: -4%; background-repeat: no-repeat; transform: scale(1.04); }
.reading { margin-top: 12px; padding: 12px; text-align: center; font: 600 24px var(--font-mono); letter-spacing: .2em; color: var(--faint); background: #06090d; border: 1px solid var(--line); border-radius: 12px; white-space: pre; }
.reading.hit { color: var(--sage); border-color: var(--sage); }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 12px; }
.meter i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .15s; }
.mt-l { margin: 6px 0 14px; font: 12px var(--font-mono); color: var(--dim); }
.sl { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.sl span { width: 84px; flex: none; font-size: 14px; color: var(--dim); }
.sl input[type=range] { flex: 1; min-width: 0; height: 32px; accent-color: var(--sage); }

/* interruptor */
.sw { width: 48px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.sw i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); transition: transform .2s; }
.sw.on { background: var(--sage); }
.sw.on i { transform: translateX(20px); background: #06130d; }
.set input[type=range] { width: 100%; height: 32px; accent-color: var(--amber); }

/* informe de cierre */
.closed { margin-left: auto; font: 700 10px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--sage); border: 1.5px solid var(--sage); padding: 4px 8px; border-radius: 4px; transform: rotate(-4deg); flex: none; }
.dec { padding: 12px 14px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.dec-k { font: 600 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.dec p { margin: 6px 0 0; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 600 24px var(--font-mono); font-variant-numeric: tabular-nums; }
.stat span { color: var(--dim); font-size: 13px; }
.loose { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.loose li { position: relative; padding: 10px 0 10px 20px; border-bottom: 1px solid var(--line); }
.loose li::before { content: ""; position: absolute; left: 4px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
.next { margin-top: 22px; padding: 16px; border: 1px dashed var(--faint); border-radius: 14px; }
.next b { font-size: 16px; }
.next p { margin: 6px 0 0; color: var(--dim); }

/* terminal · cruce de declaración (puzzle "cross") */
.pz-src { margin: -6px 0 12px; font: 12px/1.5 var(--font-mono); color: var(--faint); }
.pz-src b { color: var(--dim); font-weight: 600; }
.xlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.xl { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 11px 12px; box-sizing: border-box; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); text-align: left; }
.xl-n { flex: none; width: 16px; padding-top: 2px; font: 600 12px var(--font-mono); color: var(--faint); }
.xl-x { flex: 1; min-width: 0; font-size: 14px; }
.xl-tag { flex: none; align-self: center; font: 700 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--red); border: 1px solid var(--red); padding: 2px 6px; border-radius: 4px; }
.xl.on { background: var(--surface); border-color: var(--red); }

/* casos · pasar al día siguiente */
.next-go { width: 100%; margin-top: 14px; padding: 14px; box-sizing: border-box; }

/* anteriormente */
.recap { position: absolute; z-index: 50; inset: 0; display: flex; align-items: flex-end; background: rgba(5, 7, 10, .78); animation: fade .25s ease; }
.recap-card { width: 100%; max-height: 88%; overflow-y: auto; box-sizing: border-box; padding: 22px var(--gutr) 28px var(--gut); background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; }
.recap-k { font: 600 11px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--amber); }
.recap-card h3 { margin: 6px 0 12px; font-size: 20px; }
.recap-card h4 { margin: 18px 0 8px; font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.recap-card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.recap-card li { position: relative; padding-left: 16px; color: var(--text); font-size: 14px; }
.recap-card li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.recap-card .todo li::before { background: var(--amber); }
.recap-card .btn { width: 100%; margin-top: 20px; padding: 14px; box-sizing: border-box; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---- puzzle locate / mapa ---- */
.clues { margin: 0 0 12px; padding-left: 18px; font-size: 13px; line-height: 1.5; color: var(--dim); }
.clues li { margin-bottom: 4px; }
.mapsvg { width: 100%; display: block; background: #0d1319; border-bottom: 1px solid var(--line, #222c36); }
.mapsvg .m-bg { fill: #0d1319; }
.mapsvg .m-river { fill: #12202c; }
.mapsvg .m-rail { stroke: #3a4350; stroke-width: 2; stroke-dasharray: 6 3; fill: none; }
.mapsvg .m-st { stroke: #1c2630; stroke-width: 3; fill: none; }
.mapsvg .pin circle { fill: #e9b04a; stroke: #0d1319; stroke-width: 2; cursor: pointer; }
.mapsvg .pin.on circle { fill: #ff7a59; }
.mapsvg .pin text { font: 8px/1 var(--font-mono); fill: #cfd6dd; pointer-events: none; }
.mapnote { padding: 12px 16px; }
.mapnote p { margin: 4px 0 0; color: var(--dim); font-size: 13px; line-height: 1.5; }
.linkbtn { background: none; border: 0; color: var(--text); font: inherit; padding: 0; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: #3a4350; }

</style>

</head>

window.__FILES={"data/episodes.json": "{\"episodes\": [{\"file\": \"data/case01.json\"}, {\"file\": \"data/case02.json\"}, {\"file\": \"data/case03.json\"}, {\"file\": \"data/case04.json\"}, {\"file\": \"data/case05.json\"}, {\"file\": \"data/case06.json\"}, {\"file\": \"data/case07.json\"}, {\"file\": \"data/case08.json\"}, {\"file\": \"data/case09.json\"}]}", "data/case01.json": "{\n  \"id\": \"caso01\",\n  \"title\": \"Caso 01 · Villa Ceibal\",\n  \"dayLabel\": \"Caso 01\",\n  \"recap\": [\n    {\n      \"text\": \"Joaquín Benítez, de 19 años, apareció muerto en un baldío de Villa Ceibal.\"\n    },\n    {\n      \"text\": \"Abriste su celular con el cumpleaños que figura en el DNI.\",\n      \"if\": \"unlocked_phone_joaco\"\n    },\n    {\n      \"text\": \"Su chat con «Tío Marce» termina con una cita en un baldío, donde lo esperaba «el Flaco». Joaquín le había mandado todo a su hermana.\",\n      \"if\": \"seen_chat_marce\"\n    },\n    {\n      \"text\": \"En su galería: una mochila con paquetes sellados con un ancla de cera roja y una camioneta blanca.\",\n      \"if\": \"seen_galeria\"\n    },\n    {\n      \"text\": \"Recuperaste lo borrado: Marce lo hacía llevar una mochila sin pagarle y, la noche del crimen, Joaquín vio qué había adentro y quiso salirse.\",\n      \"if\": \"recovered_joaco\"\n    },\n    {\n      \"text\": \"Mejoraste la foto: la patente de la camioneta es AE 417 MR.\",\n      \"if\": \"enhanced_plate\"\n    },\n    {\n      \"text\": \"Un número oculto sabe que abriste el celular y nombró a la hermana.\",\n      \"if\": \"case_end\"\n    }\n  ],\n  \"contacts\": {\n    \"ibarra\": {\n      \"name\": \"Cmte. Ibarra\",\n      \"role\": \"Jefe de la Unidad\",\n      \"color\": \"#f2a23a\"\n    },\n    \"rojas\": {\n      \"name\": \"Nico Rojas\",\n      \"role\": \"Cabo · Ciberinvestigación\",\n      \"color\": \"#6aa9d8\"\n    },\n    \"desconocido\": {\n      \"name\": \"Número oculto\",\n      \"role\": \"\",\n      \"color\": \"#8a97a6\",\n      \"readonly\": true\n    }\n  },\n  \"objectives\": [\n    {\n      \"id\": \"o1\",\n      \"text\": \"Desbloquear el celular de la víctima\",\n      \"flag\": \"unlocked_phone_joaco\"\n    },\n    {\n      \"id\": \"o2\",\n      \"text\": \"Leer el chat con «Tío Marce»\",\n      \"flag\": \"seen_chat_marce\"\n    },\n    {\n      \"id\": \"o3\",\n      \"text\": \"Revisar galería y llamadas\",\n      \"flagsAll\": [\n        \"seen_galeria\",\n        \"seen_llamadas\"\n      ]\n    },\n    {\n      \"id\": \"o5\",\n      \"text\": \"Recuperar los mensajes borrados\",\n      \"flag\": \"recovered_joaco\"\n    },\n    {\n      \"id\": \"o6\",\n      \"text\": \"Mejorar la foto de la camioneta\",\n      \"flag\": \"enhanced_plate\"\n    },\n    {\n      \"id\": \"o4\",\n      \"text\": \"Informar a Ibarra\",\n      \"flag\": \"informed\"\n    }\n  ],\n  \"closing\": {\n    \"title\": \"Informe de cierre\",\n    \"summary\": [\n      \"Joaquín Benítez, 19 años, hacía de mensajero para una red que marca su mercadería con un sello de cera roja con forma de ancla.\",\n      \"La noche anterior vio qué llevaba en la mochila y quiso salirse. Su «Tío Marce» lo citó en un baldío, donde lo esperaba un tal «Flaco». Antes de morir le mandó fotos y un audio a su hermana Lucía.\",\n      \"Alguien sabe que abriste su celular. Y esa información no salió de la calle.\"\n    ],\n    \"decisions\": [\n      {\n        \"label\": \"Tu compañero\",\n        \"options\": [\n          {\n            \"flag\": \"rojas_juntos\",\n            \"text\": \"Pediste hacerlo todo junto a Rojas. Aprendés de él, pero él también te mira de cerca.\"\n          }\n        ],\n        \"fallback\": \"Te encargaste del celular y Rojas recorrió la escena. Rápido, pero cada uno sabe cosas distintas.\"\n      },\n      {\n        \"label\": \"Lo que sabías\",\n        \"options\": [\n          {\n            \"flag\": \"shared_homicidios\",\n            \"text\": \"Le pediste a Ibarra que pase todo a Homicidios. Más gente trabajando el caso, y más gente que puede filtrarlo.\"\n          },\n          {\n            \"flag\": \"kept_secret\",\n            \"text\": \"Le pediste un día más a Ibarra. Ganaste tiempo, pero ahora el secreto es solo tuyo.\"\n          }\n        ],\n        \"fallback\": \"No llegaste a decidir qué hacer con la información.\"\n      }\n    ],\n    \"loose\": [\n      \"Quién es «Tío Marce» y para quién trabaja.\",\n      \"El «Flaco», que esperaba a Joaquín en el baldío.\",\n      \"La camioneta blanca AE 417 MR: falta saber a nombre de quién está.\",\n      \"La organización del ancla.\",\n      \"Quién avisó al número oculto que abriste el celular.\",\n      \"Lucía: ¿tiene pruebas, o está en peligro?\"\n    ],\n    \"next\": {\n      \"title\": \"Temporada 1 · Episodio 2\",\n      \"text\": \"Mañana temprano en la oficina. Homicidios le tomó declaración a Lucía, la hermana de Joaquín, y hay algo en lo que dijo que no cierra.\",\n      \"cta\": \"Pasar al día siguiente\"\n    }\n  },\n  \"terminal\": {\n    \"intro\": [\n      \"UCI-SH 0.3 · credencial nivel 2 (provisoria)\",\n      \"Escribí «ayuda» o tocá un comando de abajo.\"\n    ],\n    \"tools\": [\n      {\n        \"name\": \"recover\",\n        \"desc\": \"recuperación de datos borrados\",\n        \"short\": \"recupera datos borrados\",\n        \"on\": true\n      },\n      {\n        \"name\": \"enhance\",\n        \"desc\": \"mejora de imágenes\",\n        \"short\": \"mejora imágenes\",\n        \"on\": true\n      },\n      {\n        \"name\": \"trace\",\n        \"desc\": \"rastreo de líneas y antenas\",\n        \"on\": false,\n        \"lvl\": 3\n      },\n      {\n        \"name\": \"crack\",\n        \"desc\": \"descifrado de claves\",\n        \"on\": false,\n        \"lvl\": 3\n      }\n    ],\n    \"targets\": {\n      \"celular_propio\": {\n        \"tool\": \"recover\",\n        \"title\": \"Dispositivo asignado\",\n        \"locked\": true,\n        \" abló con Joaquín. Llamadas: Joaquín la llamó el 14/10 a las 23:47 y hablaron 2 min 14 s.\",\n        \"N.º 4 · Dijo que no salió de su casa. Ubicaciones: en movimiento desde las 23:58 y junto a la antena de Los Álamos entre las 00:19 y las 00:36.\",\n        \"N.º 5 · Dijo que no recibió nada. Chat: tres fotos y un audio de Joaquín entre las 23:46 y las 23:47.\",\n        \"Se sostienen la n.º 6 y la n.º 7: no tiene vínculo con la línea de «Marce» y no volvió a salir de su casa.\"\n      ],\n      \"notesOnSeen\": [\n        \"n_cruce\"\n      ]\n    },\n    \"audio_lucia\": {\n      \"kind\": \"audio\",\n      \"group\": \"Celular de Lucía\",\n      \"title\": \"Audio de Joaquín a Lucía\",\n      \"duration\": 24,\n      \"lines\": [\n        {\n          \"t\": 0,\n          \"x\": \"[viento, pasos rápidos, una respiración agitada]\"\n        },\n        {\n          \"t\": 2,\n          \"x\": \"Lu, escuchame bien.\"\n        },\n        {\n          \"t\": 5,\n          \"x\": \"Las fotos son de la mochila. Lo que llevo no es ropa.\"\n        },\n        {\n          \"t\": 10,\n          \"x\": \"Me hacen decirle tío a Marce, pero no es mi tío. Ni sé si es una sola persona.\"\n        },\n        {\n          \"t\": 16,\n          \"x\": \"Si me pasa algo, guardá todo. Y no se lo des a nadie que te llame primero.\"\n        },\n        {\n          \"t\": 21,\n          \"x\": \"Esperá a que te busquen en persona. Perdoname, Lu.\"\n        },\n        {\n          \"t\": 24,\n          \"x\": \"[se corta]\"\n        }\n      ],\n      \"notesOnSeen\": [\n        \"n_audio_joaquin\"\n      ]\n    },\n    \"chat_marce_post\": {\n      \"kind\": \"chat\",\n      \"group\": \"Celular de Joaquín\",\n      \"inPhone\": \"phone_joaco\",\n      \"title\": \"Mensaje de un número sin agendar\",\n      \"who\": \"Número sin agendar\",\n      \"line\": \"555-0183 · línea prepaga\",\n      \"messages\": [\n        {\n          \"s\": \"them\",\n          \"t\": \"16/10 03:1 sentado Tomás\",\n      \"flagsAny\": [\n        \"e3_testigo\",\n        \"e3_imputado\"\n      ]\n    }\n  ],\n  \"closing\": {\n    \"title\": \"Informe de cierre\",\n    \"summary\": [\n      \"Néstor Domínguez denunció que alguien entró de noche a su taller y se llevó la lista de clientes: patentes, DNI y direcciones. El registro del router y los metadatos de la foto mostraron que nadie entró: los datos los copió su aprendiz, Tomás, de 17 años.\",\n      \"Un hombre muy flaco, de campera gris, le dio un pendrive y 30.000 pesos y le pidió la lista «de los autos blancos de trabajo». Tomás tuvo miedo de contarlo y Néstor, para taparlo, armó la foto del falso intruso.\",\n      \"En la trastienda hay cajas selladas con cera roja y un ancla. El taller no es la víctima: es un punto de paso de la red.\"\n    ],\n    \"decisions\": [\n      {\n        \"label\": \"Cómo quedó Tomás\",\n        \"options\": [\n          {\n            \"flag\": \"e3_testigo\",\n            \"text\": \"Lo asentaste como testigo protegido. Su nombre no figura en el expediente y colaboró.\"\n          },\n          {\n            \"flag\": \"e3_imputado\",\n            \"text\": \"Lo asentaste como partícipe. El expediente cierra más prolijo, pero ahora su nombre figura y el Flaco puede enterarse.\"\n          }\n        ],\n        \"fallback\": \"No llegaste a decidir cómo asentar a Tomás.\"\n      },\n      {\n        \"label\": \"Cómo hablaste con Néstor\",\n        \"options\": [\n          {\n            \"flag\": \"e3_confronta\",\n            \"text\": \"Le mostraste que la foto era falsa. Se enojó, pero dejó de mentir.\"\n          },\n          {\n            \"flag\": \"e3_pregunta\",\n            \"text\": \"Le preguntaste por Tomás sin mostrarle nada. Se quebró solo.\"\n          }\n        ],\n        \"fallback\": \"No llegaste a hablar con Néstor.\"\n      }\n    ],\n    \"loose\": [\n      \"El hombre flaco de campera gris que le pagó a Tomás: ¿es el Flaco del baldío?\",\n      \"Para qué quiere la lista de camionetas blancas de trabajo.\",\n      \"Las cajas con el ancla en la trastienda: quién las deja y quién las retira.\",\n      \"El 555-0147 y el 555-0183 siguen sin dueño.\",\n      \"La camioneta AE 417 MR: el registro automotor sigue cerrado.\"\n    ],\n    \"next\": {\n      \"title\": \"Temporada 1 · Episodio 4\",\n      \"text\": \"«La patente». La lista del taller y la camioneta blanca apuntan al mismo lugar: una empresa que no tendría que existir.\",\n      \"cta\": \"Pasar al día siguiente\"\n    }\n  },\n  \"terminal\": {\n    \"tools\": [\n      {\n        \"name\": \"meta\",\n        \"desc\": \"metadatos de archivos\",\n        \"short\": \"lee los metadatos de una foto o archivo\",\n        \"on\": true\n      }\n    ],\n    \"targets\": {\n      \"foto_taller\": {\n        \"tool\": \"meta\",\n        \"title\": \"Metadatos · foto del intruso\",\n        \"done\": \"Metadatos extraídos.\",\n        \"requires\": [\n          \"seen_e3_foto\",\n          \"seen_e3_denuncia\"\n        ],\n        \"denied\": \"Primero revisá la foto y la denuncia: tenés que saber qué se afirma antes de contrastarlo.\",\n        \"log\": [\n          \"Abriendo archivo IMG_0412.jpg…\",\n          \"Extrayendo cabecera EXIF…\",\n          \"Contrastando con la denuncia de Néstor.\"\n        ],\n        \"puzzle\": {\n          \"type\": \"cross\",\n          \"tag\": \"No encaja\",\n          \"prompt\": \"Néstor dice que la foto es del 14/10 a las 22:05, tomada en el taller, sin retoques. Marcá los datos de la foto que no encajan con eso.\",\n          \"sources\": [\n            \"Denuncia\",\n            \"Cabecera EXIF\"\n          ],\n          \"lines\": [\n            {\n              \"id\": \"m1\",\n              \"x\": \"Cámara: celular de uso personal (el mismo modelo que usa Néstor).\"\n            },\n            {\n              \"id\": \"m2\",\n              \"x\": \"Fecha de captura: 12/10 19:40.\"\n            },\n ARO.PAGOS.\",\n      \"Faro, el mismo nombre de la sociedad dueña de la camioneta del baldío.\"\n    ],\n    \"decisions\": [\n      {\n        \"label\": \"Cómo seguiste\",\n        \"options\": [\n          {\n            \"flag\": \"e6_operativo\",\n            \"text\": \"Fuiste por el mensajero. Lo detuvieron en el cajero, con el efectivo, y su celular tenía la hoja de guion. El chico sigue en el circuito.\"\n          },\n          {\n            \"flag\": \"e6_protegido\",\n            \"text\": \"Fuiste primero por el chico. Niñez lo encontró y lo sacó del circuito. El mensajero adulto sigue libre.\"\n          }\n        ],\n        \"fallback\": \"No llegaste a decidir.\"\n      }\n    ],\n    \"loose\": [\n      \"El alias FARO.PAGOS: a quién pertenece la cuenta.\",\n      \"Quién arma las hojas de guion y las reparte entre los chicos.\",\n      \"Cuántos chicos más están en el circuito.\",\n      \"La conexión de este caso con Faro: ¿es la misma red?\",\n      \"El plazo del viernes para Lucía: dos días.\"\n    ],\n    \"next\": {\n      \"title\": \"Temporada 1 · Episodio 7\",\n      \"text\": \"«La sombra en el celular». Algo en el celular de Joaquín no cierra: siguió hablando después de que lo dejaron en custodia.\",\n      \"cta\": \"Pasar a la tarde\"\n    }\n  },\n  \"terminal\": {\n    \"tools\": [\n      {\n        \"name\": \"voz\",\n        \"desc\": \"análisis de voz y audio\",\n        \"short\": \"analiza una grabación\",\n        \"on\": true\n      }\n    ],\n    \"targets\": {\n      \"llamada_rosa\": {\n        \"tool\": \"voz\",\n        \"title\": \"Análisis de voz · llamada a Rosa\",\n        \"done\": \"Análisis completo.\",\n        \"requires\": [\n          \"seen_e6_audio\",\n          \"seen_e6_denuncia\"\n        ],\n        \"denied\": \"Primero escuchá la grabación y leé la denuncia.\",\n        \"log\": [\n          \"Cargando grabación de 0:28…\",\n          \"Separando voz principal, fondo y segunda voz…\",\n          \"Marcá lo que delata a quien llama.\"\n        ],\n        \"puzzle\": {\n          \"type\": \"cross\",\n          \"tag\": \"Delata\",\n          \"prompt\": \"Marcá los elementos de la grabación que delatan quién llama y cómo trabaja. Dejá sin marcar lo que podría decir cualquier estafador.\",\n          \"sources\": [\n            \"Grabación\",\n            \"Espectro de voz\"\n          ],\n          \"lines\": [\n            {\n              \"id\": \"v1\",\n              \"x\": \"Fondo: un timbre agudo de escuela y ruido de patio.\"\n            },\n            {\n              \"id\": \"v2\",\n              \"x\": \"«Abuela, soy Nico. Tuve un accidente, estoy bien, pero necesito plata.»\"\n            },\n            {\n              \"id\": \"v3\",\n              \"x\": \"«Esto… perdón, me trabé. El abogado dice que… que necesito cuatrocientos mil.»\"\n            },\n            {\n              \"id\": \"v4\",\n              \"x\": \"«Bajá al cajero de la Avenida Mitre y esperá en la puerta.»\"\n            },\n            {\n              \"id\": \"v5\",\n              \"x\": \"«No le cuentes a nadie, ¿sí?»\"\n            },\n            {\n              \"id\": \"v6\",\n              \"x\": \"Una segunda voz, a lo lejos: «Seguí, seguí.»\"\n            },\n            {\n              \"id\": \"v7\",\n              \"x\": \"«Seguí el procedimiento. Un mensajero va a retirar el sobre.»\"\n            }\n          ],\n          \"solution\": [\n            \"v1\",\n            \"v3\",\n            \"v6\",\n            \"v7\"\n          ],\n          \"hint\": \"Cuatro. Dos revelan que lee un texto, una que hay alguien apuntándole y otra que es un chico y está en un colegio.\"\n        },\n        \"onSolve\": {\n          \"flag\": \"e6_voz_ok\",\n          \"evidence\": \"e6_perfil\",\n          \"script\": \"e6_voz_ok\"\n        }\n      }\n    }\n  },\n  \"evidence\": {\n    \"e6_denuncia\": {\n      \"kind\": \"doc\",\n      \"group\": \"Estafa a mayores\",\n      \"title\": \"Denuncia · Rosa Aguilar\",\n      \"meta\": [\n        [\n          \"Denunciante\",\n          \"Rosa Aguilar · 78 años\"\n        ],\n        [\n          \"Fecha\",\n          \"20/10 · 17:20\"\n        ],\n        [\n          \"Monto\",\n          \"$400.000\"\n        ]\n      ],\n      \"body\": [\n        \"«Me llamó mi nieto Nico llorando. Dijo que había chocado y que estaba en la comisaría. Me pidió plata para un abogado.»\",\n        \"«Me dijo que fuera al cajero de la Avenida Mitre y que le diera un sobre a un mensajero que iba a pasar.»\",\n        \"«Fui. Había un hombre con gorra. Le di el sobre. Cuando llamé a Nico de verdad, estaba en el colegio.»\",\n        \"Observación: la víctima conserva la grabación porque su celular graba automáticamente las llamadas.\"\n      ],\n      \"notesOnSeen\": [\n        \"n_e6_denuncia\"\n      ]\n    },\n    \"e6_cajero\": {\n      \"kind\": \"doc\",\n      \"group\": \"Estafa a mayores\",\n      \"title\": \"Cámara del cajero · Av. Mitre 1450\",\n      \"meta\": [\n        [\n          \"Hora\",\n          \"20/10 · 15:12\"\n        ],\n        [\n          \"Cámara\",\n          \"Cajero automático\"\n        ],\n        [\n          \"Calidad\",\n          \"Baja\"\n        ]\n      ],\n      \"body\": [\n        \"Se ve a una mujer mayor entregando un sobre a un hombre de gorra y campera oscura. El hombre guarda el sobre y se va caminando hacia el este.\",\n        \"No se alcanza a ver su rostro. A los veinte minutos, el mismo hombre vuelve a aparecer en un cajero distinto, a ocho cuadras, con otra persona mayor.\",\n        \"Es una operatoria seriada: varias víctimas el mismo día.\"\n      ],\n      \"notesOnSeen\": [\n        \"n_e6_cajero\"\n      ]\n    },\n    \"e6_audio\": {\n      \"kind\": \"audio\",\n      \"group\": \"Estafa a mayores\",\n      \"title\": \"Llamada a Rosa · 20/10 14:31\",\n      \"duration\": 28,\n      \"lines\": [\n        {\n          \"t\": 0,\n  \"Hoja de guion · «Procedimiento abuela»\",\n      \"meta\": [\n        [\n          \"Origen\",\n          \"Celular del mensajero / bolso del chico\"\n        ],\n        [\n          \"Formato\",\n          \"Hoja impresa con una marca de agua\"\n        ],\n        [\n          \"Marca\",\n          \"Un ancla\"\n        ]\n      ],\n      \"body\": [\n        \"1. Saludo: «Abuela, soy [nombre]. Tuve un accidente».\",\n        \"2. Pedir plata para un abogado. Monto entre 300 y 500 mil. Si duda, llorar.\",\n        \"3. Pasar a un «doctor» o «abogado» (segunda voz).\",\n        \"4. Indicar un cajero de la zona y el horario. Avisar al mensajero.\",\n        \"5. Cobro: sobre en mano. El mensajero deposita en la cuenta con alias FARO.PAGOS. Comisión: 10 %.\",\n        \"Al pie de la hoja, en marca de agua: un ancla.\"\n      ],\n      \"notesOnSeen\": [\n        \"n_e6_hoja\"\n      ]\n    }\n  },\n  \"notes\": {\n    \"n_e6_denuncia\": {\n      \"text\": \"A Rosa Aguilar (78) la llamaron diciéndole que su nieto había chocado y le sacaron 400.000 pesos en un cajero.\",\n      \"src\": \"Denuncia\"\n    },\n    \"n_e6_cajero\": {\n      \"text\": \"Un hombre con gorra retira el sobre y 20 minutos después hace lo mismo con otra víctima en otro cajero. Es una operatoria en serie.\",\n      \"src\": \"Cámara\"\n    },\n    \"n_e6_audio\": {\n      \"text\": \"En la llamada se oye un timbre escolar de fondo, vacilaciones al leer y una segunda voz que apunta con «seguí, seguí».\",\n      \"src\": \"Grabación\"\n    },\n    \"n_e6_perfil\": {\n      \"text\": \"Quien llama es un adolescente de unos 15 años que lee un texto, guiado por un adulto. Es un instrumento, no el autor.\",\n      \"src\": \"Análisis de voz\"\n    },\n    \"n_e6_hoja\": {\n      \"text\": \"La hoja de guion termina con el alias de pago FARO.PAGOS y una marca de agua con un ancla.\",\n      \"src\": \"Hoja de guion\"\n    }\n  },\n  \"scripts\": {\n    \"e6_start\": [\n      {\n        \"wait\": 3 <script>
/* Estado del juego + bus de eventos. Todo lo persistente vive en Store.state. */
(function () {
  'use strict';
  var KEY = 'uci-juego-v1';
  var timer = null;

  function defaults() {
    return {
      v: 1, name: '', pace: 'real', setup: false, elapsed: 0,
      flags: {}, fired: {}, threads: {}, threadOrder: [],
      evidence: [], notes: [], queue: [], pinFails: {}, starred: {},
      ep: 0, epStart: [0], pz: {}, lastSeen: 0,
      snd: { amb: true, fx: true }, vol: 60
    };
  }

  var Bus = {
    _h: {},
    on: function (e, f) {
      var self = this;
      (this._h[e] = this._h[e] || []).push(f);
      return function () { self._h[e] = self._h[e].filter(function (x) { return x !== f; }); };
    },
    emit: function (e, d) {
      (this._h[e] || []).slice().forEach(function (f) {
        try { f(d); } catch (err) { console.error(err); }
      });
    }
  };

  var Store = {
    state: defaults(),
    canSave: false,
    openThread: null, // hilo abierto ahora mismo (no se guarda)

    load: function () {
      try {
        localStorage.setItem(KEY + '-t', '1');
        localStorage.removeItem(KEY + '-t');
        this.canSave = true;
        var raw = localStorage.getItem(KEY);
        if (raw) {
          var s = JSON.parse(raw);
          if (s && s.v === 1) this.state = Object.assign(defaults(), s);
        }
      } catch (e) { /* sin almacenamiento: la partida vive en memoria */ }
      Object.keys(this.state.threads).forEach(function (k) { Store.state.threads[k].typing = false; });
    },
    save: function () {
      clearTimeout(timer);
      timer = setTimeout(function () { Store.saveNow(); }, 400);
    },
    saveNow: function () {
      if (!this.canSave) return;
      try { localStorage.setItem(KEY, JSON.stringify(this.state)); } catch (e) {}
    },
    reset: function () {
      clearTimeout(timer);
      try { localStorage.removeItem(KEY); } catch (e) {}
      this.state = defaults();
    }
  };

  window.Bus = Bus;
  window.Store = Store;
})();
