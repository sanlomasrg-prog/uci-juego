<script>
/* App Mensajes: lista de conversaciones, hilo con indicador de escritura y respuestas elegibles. */
(function () {
  'use strict';
  var esc = OS.esc;

  function initials(name) {
    return name.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g, '').split(' ').filter(Boolean).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('') || '?';
  }
  function hhmm(at) {
    return new Date(at).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function avatar(id, big) {
    var c = Engine.contact(id);
    return '<span class="av' + (big ? ' av-lg' : '') + '" style="--c:' + c.color + '">' + initials(c.name) + '</span>';
  }

  OS.register({
    id: 'messages', name: 'Mensajes', hue: 'amber',
    mount: function (el, params) {
      var view = null, offs = [];

      function listHTML() {
        var st = Store.state;
        var ids = st.threadOrder.slice().sort(function (a, b) {
          var la = st.threads[a].messages.slice(-1)[0], lb = st.threads[b].messages.slice(-1)[0];
          return (lb ? lb.at : 0) - (la ? la.at : 0);
        }).filter(function (id) { return st.threads[id].messages.length; });
        var rows = ids.map(function (id) {
          var th = st.threads[id], last = th.messages[th.messages.length - 1], c = Engine.contact(id);
          var prev = th.typing ? '<i class="typ">escribiendo…</i>' : esc((last.from === 'me' ? 'Vos: ' : '') + Engine.text(last.text));
          return '<button class="row" data-thread="' + id + '">' + avatar(id) +
            '<span class="row-main"><span class="row-top"><b>' + esc(c.name) + '</b><time>' + hhmm(last.at) + '</time></span>' +
            '<span class="row-bot"><span class="prev">' + prev + '</span>' +
            (th.unread ? '<span class="unread">' + th.unread + '</span>' : '') + '</span></span></button>';
        }).join('');
        return '<header class="app-h"><button class="back" data-act="close" aria-label="Volver al inicio">' + OS.icon('back') + '</button><h2>Mensajes</h2></header>' +
          '<div class="scroll">' + (rows || '<p class="empty">Todavía no tenés mensajes. Cuando llegue algo, aparece acá.</p>') + '</div>';
      }

      function bubbles(th) {
        var out = th.messages.map(function (m) {
          var me = m.from === 'me';
          return '<div class="b ' + (me ? 'me' : 'them') + '"><span>' + esc(Engine.text(m.text)) + '</span><time>' + hhmm(m.at) + '</time></div>';
        }).join('');
        if (th.typing) out += '<div class="b them typing" aria-label="Escribiendo"><i></i><i></i><i></i></div>';
        return out;
      }

      function composer(th, c) {
        if (th.choice) {
          return '<div class="choices"><p class="choice-k">Elegí cómo responder</p>' +
            th.choice.options.map(function (o, i) {
              return '<button class="choice" data-choice="' + i + '">' + esc(o.label) + '</button>';
            }).join('') + '</div>';
        }
        return '<div class="composer-off">' + (c.readonly ? 'No podés responder a este número.' : 'Esperando respuesta…') + '</div>';
      }

      function threadHTML(id) {
        var th = Engine.thread(id), c = Engine.contact(id);
        return '<header class="app-h"><button class="back" data-act="list" aria-label="Volver a conversaciones">' + OS.icon('back') + '</button>' +
          avatar(id) + '<div class="h-who"><h2>' + esc(c.name) + '</h2><span>' + esc(c.role || 'Sin identificar') + '</span></div></header>' +
          '<div class="msgs scroll" id="msgs">' + bubbles(th) + '</div>' +
          '<footer class="composer" id="composer">' + composer(th, c) + '</footer>';
      }

      function toBottom() {
        var m = el.querySelector('#msgs');
        if (m) m.scrollTop = m.scrollHeight;
      }

      function showList() {
        view = null; Store.openThread = null;
        el.innerHTML = listHTML();
      }
      function showThread(id) {
        view = id; Store.openThread = id;
        var th = Engine.thread(id);
        th.unread = 0; Store.save(); Bus.emit('badges');
        el.innerHTML = threadHTML(id);
        toBottom();
      }
      function refreshThread() {
        var th = Engine.thread(view), c = Engine.contact(view);
        var m = el.querySelector('#msgs'), cp = el.querySelector('#composer');
        if (!m || !cp) return;
        m.innerHTML = bubbles(th); cp.innerHTML = composer(th, c); toBottom();
      }

      el.addEventListener('click', function (e) {
        var t;
        if ((t = e.target.closest('[data-act]'))) {
          if (t.getAttribute('data-act') === 'close') OS.close(); else showList();
        } else if ((t = e.target.closest('[data-thread]'))) {
          showThread(t.getAttribute('data-thread'));
        } else if ((t = e.target.closest('[data-choice]'))) {
          Bus.emit('sfx', 'key');
          Engine.choose(view, +t.getAttribute('data-choice'));
        }
      });

      offs.push(Bus.on('thread', function (id) {
        if (view === null) showList();
        else if (view === id) refreshThread();
      }));

      if (params.thread) showThread(params.thread); else showList();

      return {
        show: function (p) { if (p.thread) showThread(p.thread); else showList(); },
        destroy: function () { offs.forEach(function (f) { f(); }); Store.openThread = null; }
      };
    }
  });
})();

</script>
<script>
/* App Evidencia: lista agrupada y visores por tipo (doc, fotos, chat, llamadas, audio, celular con PIN). */
(function () {
  'use strict';
  var esc = OS.esc;
  function fmt(n) { n = Math.floor(n); return Math.floor(n / 60) + ':' + (n % 60 < 10 ? '0' : '') + (n % 60); }
  var KIND = { doc: 'Documento', photo: 'Fotos', chat: 'Chat', calls: 'Llamadas', audio: 'Audio', phone: 'Dispositivo' };

  /* ---------- visores ---------- */
  var View = {
    doc: function (d) {
      return '<dl class="meta">' + (d.meta || []).map(function (m) {
        return '<div><dt>' + esc(m[0]) + '</dt><dd>' + esc(m[1]) + '</dd></div>';
      }).join('') + '</dl>' + (d.body || []).map(function (p) { return '<p class="doc-p">' + esc(p) + '</p>'; }).join('');
    },
    photo: function (d) {
      return d.items.map(function (it) {
        return '<figure class="photo">' + (it.src ? '<div class="shot"><img class="photo-img" src="' + esc(it.src) + '" alt="' + esc(it.caption) + '" loading="lazy">' + (it.stamp ? '<span class="stamp">' + esc(it.stamp) + '</span>' : '') + '</div>' : Scenes[it.scene]()) + '<figcaption>' + esc(it.caption) +
          '<span class="mono">' + esc(it.meta) + '</span></figcaption></figure>';
      }).join('');
    },
    chat: function (d) {
      return '<div class="chat-head"><b>' + esc(d.who) + '</b><span class="mono">' + esc(d.line) + '</span></div><div class="chat-body">' +
        d.messages.map(function (m) {
          if (m.s === 'sys') return '<p class="sys">' + esc(m.x) + '</p>';
          return '<div class="b ' + (m.s === 'me' ? 'vic' : 'them') + '"><span>' + esc(m.x) + '</span><time>' + esc(m.t) + '</time></div>';
        }).join('') + '</div>';
    },
    calls: function (d) {
      return '<div class="calls">' + d.rows.map(function (r) {
        var missed = r.s === 'perdida';
        return '<div class="call' + (missed ? ' missed' : '') + '"><span class="call-d">' + (r.d === 'out' ? '↗' : '↙') + '</span>' +
          '<span class="call-n"><b>' + esc(r.n) + '</b><i>' + esc(r.t) + '</i></span><span class="call-s mono">' + esc(r.s) + '</span></div>';
      }).join('') + '</div>';
    },
    audio: function (d) {
      var bars = '';
      for (var i = 0; i < 40; i++) bars += '<i style="height:' + (18 + Math.round(Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.6)) * 70)) + '%"></i>';
      return '<div class="audio"><button class="play" id="aPlay" aria-label="Reproducir">' + OS.icon('play') + '</button>' +
        '<div class="wave" id="aWave">' + bars + '</div><span class="mono" id="aTime">0:00 / ' + fmt(d.duration) + '</span></div>' +
        '<div class="transcript" id="aTrans"><p class="hint">Tocá reproducir para escuchar el audio.</p></div>';
    }
  };

  function mountAudio(el, id, d) {
    var play = el.querySelector('#aPlay'), wave = el.querySelector('#aWave'), tm = el.querySelector('#aTime'), tr = el.querySelector('#aTrans');
    var bars = wave.children, t = 0, iv = null;
    function paint() {
      var p = t / d.duration;
      for (var i = 0; i < bars.length; i++) bars[i].className = i / bars.length < p ? 'on' : '';
      tm.textContent = fmt(t) + ' / ' + fmt(d.duration);
      tr.innerHTML = d.lines.filter(function (l) { return l.t <= t; }).map(function (l) { return '<p>' + esc(l.x) + '</p>'; }).join('') ||
        '<p class="hint">…</p>';
    }
    function stop() { clearInterval(iv); iv = null; play.innerHTML = OS.icon('play'); }
    play.onclick = function () {
      if (iv) { stop(); return; }
      if (t >= d.duration) t = 0;
      play.innerHTML = OS.icon('pause');
      Engine.markSeen(id);
      iv = setInterval(function () {
        t += 0.1;
        if (t >= d.duration) { t = d.duration; stop(); }
        paint();
      }, 100);
    };
    return function () { clearInterval(iv); };
  }

  /* ---------- celular bloqueado ---------- */
  function phoneHTML(id, d) {
    if (Engine.has('unlocked_' + id)) {
      var extra = Store.state.evidence.filter(function (x) {
        var e = Engine.data.evidence[x];
        return e && e.inPhone === id && d.contains.indexOf(x) === -1;
      });
      var items = d.contains.concat(extra).map(function (cid) {
        var def = Engine.data.evidence[cid];
        return '<button class="row" data-open="' + cid + '"><span class="ev-ico">' + OS.icon(def.kind) + '</span>' +
          '<span class="row-main"><span class="row-top"><b>' + esc(def.title) + '</b>' + (Engine.isNew(cid) ? '<span class="new">Nuevo</span>' : '') + '</span>' +
          '<span class="row-bot"><span class="prev">' + KIND[def.kind] + '</span></span></span></button>';
      }).join('');
      return '<p class="ok-line">' + OS.icon('check') + ' Desbloqueado. Se extrajo el contenido:</p>' + items;
    }
    var f = Store.state.pinFails[id] || 0;
    var keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(function (k) {
      return k === '' ? '<span></span>' : '<button class="key" data-k="' + k + '">' + k + '</button>';
    }).join('');
    return '<div class="pin"><div class="pin-lock">' + OS.icon('lock') + '</div><p class="pin-t">' + esc(d.model) + '</p>' +
      '<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>' +
      '<p class="pin-m" id="pinMsg">' + (f ? 'PIN incorrecto. Intentos fallidos: ' + f : esc(d.pinHint)) + '</p>' +
      '<div class="keys">' + keys + '</div></div>';
  }

  /* ---------- app ---------- */
  OS.register({
    id: 'evidence', name: 'Evidencia', hue: 'steel',
    mount: function (el, params) {
      var view = null, offs = [], cleanup = null;

      function listHTML() {
        var groups = {}, order = [];
        Store.state.evidence.forEach(function (id) {
          var d = Engine.data.evidence[id];
          if (d.kind !== 'phone' && d.group === 'Celular de Joaquín' && !Engine.has('unlocked_phone_joaco')) return;
          if (!groups[d.group]) { groups[d.group] = []; order.push(d.group); }
          groups[d.group].push(id);
        });
        var body = order.map(function (g) {
          return '<h3 class="grp">' + esc(g) + '</h3>' + groups[g].map(function (id) {
            var d = Engine.data.evidence[id];
            var locked = d.kind === 'phone' && !Engine.has('unlocked_' + id);
            return '<button class="row" data-open="' + id + '"><span class="ev-ico">' + OS.icon(locked ? 'lock' : d.kind) + '</span>' +
              '<span class="row-main"><span class="row-top"><b>' + esc(d.title) + '</b>' + (Engine.isNew(id) ? '<span class="new">Nuevo</span>' : '') + '</span>' +
              '<span class="row-bot"><span class="prev">' + KIND[d.kind] + (locked ? ' · bloqueado' : '') + '</span></span></span></button>';
          }).join('');
        }).join('');
        return '<header class="app-h"><button class="back" data-act="close" aria-label="Volver al inicio">' + OS.icon('back') + '</button>' +
          '<div class="h-who"><h2>Evidencia</h2><span>' + esc(Engine.data.title) + '</span></div></header>' +
          '<div class="scroll">' + (body || '<p class="empty">Todavía no hay evidencia cargada.</p>') + '</div>';
      }

      function detailHTML(id) {
        var d = Engine.data.evidence[id];
        var inner = d.kind === 'phone' ? '<div id="phoneBox">' + phoneHTML(id, d) + '</div>' : View[d.kind](d);
        return '<header class="app-h"><button class="back" data-act="list" aria-label="Volver a la lista">' + OS.icon('back') + '</button>' +
          '<div class="h-who"><h2>' + esc(d.title) + '</h2><span>' + KIND[d.kind] + '</span></div></header>' +
          '<div class="scroll detail">' + inner + '</div>';
      }

      function endView() { if (cleanup) { cleanup(); cleanup = null; } }

      function showList() { endView(); view = null; el.innerHTML = listHTML(); }

      function showDetail(id) {
        endView();
        view = id;
        var d = Engine.data.evidence[id];
        el.innerHTML = detailHTML(id);
        if (d.kind === 'phone') { wirePin(id, d); return; }
        if (d.kind === 'audio') cleanup = mountAudio(el, id, d);
        else Engine.markSeen(id);
      }

      function wirePin(id, d) {
        var box = el.querySelector('#phoneBox'), buf = '';
        if (Engine.has('unlocked_' + id)) return;
        function dots() {
          var di = box.querySelectorAll('#dots i');
          for (var i = 0; i < di.length; i++) di[i].className = i < buf.length ? 'on' : '';
        }
        box.onclick = function (e) {
          var k = e.target.closest('[data-k]');
          if (!k) return;
          var v = k.getAttribute('data-k');
          Bus.emit('sfx', 'key');
          if (v === '⌫') buf = buf.slice(0, -1); else if (buf.length < 4) buf += v;
          dots();
          if (buf.length < 4) return;
          var ok = Engine.tryPin(id, buf);
          if (ok) { Bus.emit('sfx', 'ok'); Engine.markSeen(id); box.innerHTML = phoneHTML(id, d); return; }
          Bus.emit('sfx', 'err');
          var dd = box.querySelector('#dots');
          dd.classList.add('shake');
          setTimeout(function () {
            dd.classList.remove('shake'); buf = ''; dots();
            box.querySelector('#pinMsg').textContent = 'PIN incorrecto. Intentos fallidos: ' + (Store.state.pinFails[id] || 0);
          }, 420);
        };
      }

      el.addEventListener('click', function (e) {
        var t;
        if ((t = e.target.closest('[data-act]'))) {
          if (t.getAttribute('data-act') === 'close') OS.close(); else showList();
        } else if ((t = e.target.closest('[data-open]'))) {
          showDetail(t.getAttribute('data-open'));
        }
      });

      offs.push(Bus.on('evidence', function () { if (view === null) showList(); }));

      if (params.id) showDetail(params.id); else showList();

      return {
        show: function (p) { if (p.id) showDetail(p.id); else showList(); },
        destroy: function () { endView(); offs.forEach(function (f) { f(); }); }
      };
    }
  });
})();

</script>
<script>
/* App Notas: objetivos del caso y tablero de pistas. */
(function () {
  'use strict';
  var esc = OS.esc;

  OS.register({
    id: 'notes', name: 'Notas', hue: 'rose',
    mount: function (el) {
      var offs = [];

      function html() {
        var st = Store.state, objs = Engine.data.objectives;
        var o = objs.map(function (x) {
          var d = Engine.objectiveDone(x);
          return '<li class="' + (d ? 'done' : '') + '"><span class="tick">' + (d ? OS.icon('check') : '') + '</span>' + esc(x.text) + '</li>';
        }).join('');
        var clues = st.notes.slice().reverse().map(function (id) {
          var n = Engine.data.notes[id], s = !!st.starred[id];
          return '<div class="clue' + (s ? ' starred' : '') + '"><div class="clue-t"><p>' + esc(n.text) + '</p>' +
            '<button class="star" data-star="' + id + '" aria-pressed="' + s + '" aria-label="Marcar como importante">' + OS.icon('star') + '</button></div>' +
            '<span class="src">' + esc(n.src) + '</span></div>';
        }).join('');
        return '<header class="app-h"><button class="back" data-act="close" aria-label="Volver al inicio">' + OS.icon('back') + '</button>' +
          '<div class="h-who"><h2>Notas</h2><span>' + esc(Engine.data.title) + '</span></div></header>' +
          '<div class="scroll"><h3 class="grp">Objetivos</h3><ul class="objs">' + o + '</ul>' +
          '<h3 class="grp">Pistas · ' + st.notes.length + '</h3>' +
          (clues || '<p class="empty">Las pistas que encuentres se guardan acá solas.</p>') + '</div>';
      }

      function render() {
        var sc = el.querySelector('.scroll'), y = sc ? sc.scrollTop : 0;
        el.innerHTML = html();
        var n = el.querySelector('.scroll');
        if (n) n.scrollTop = y;
      }

      el.addEventListener('click', function (e) {
        var t;
        if ((t = e.target.closest('[data-act]'))) OS.close();
        else if ((t = e.target.closest('[data-star]'))) {
          var id = t.getAttribute('data-star');
          Store.state.starred[id] = !Store.state.starred[id];
          Store.save(); render();
        }
      });
      offs.push(Bus.on('notes', render));
      offs.push(Bus.on('flag', render));
      render();
      return { destroy: function () { offs.forEach(function (f) { f(); }); } };
    }
  });
})();

</script>
<script>
/* App Terminal: consola con comandos escritos o por toque, y minijuegos de hackeo.
   Los objetivos y sus puzzles viven en el caso (data/caso*.json → "terminal").
   Para sumar un puzzle nuevo: agregar un target en el JSON; si es de otro tipo, un renderer en PUZZLES. */
(function () {
  'use strict';
  var esc = OS.esc;

  /* ---------- puzzle "order": ordenar fragmentos ---------- */
  var PUZZLES = {
    order: function (box, t, api) {
      var P = t.puzzle, placed = [], msg = '';
      var byId = {};
      P.fragments.forEach(function (f) { byId[f.id] = f; });
      var failKey = 'puz_' + t.id;

      function frag(f) {
        return '<span class="fr-w">' + esc(f.who) + '</span><span class="fr-x">' + esc(f.x) + '</span>' +
          (f.t ? '<span class="fr-t">' + esc(f.t) + '</span>' : '');
      }
      function draw() {
        var n = P.solution.length, slots = '';
        for (var i = 0; i < n; i++) {
          var id = placed[i];
          slots += id
            ? '<li class="filled"><button class="fr" data-un="' + id + '" aria-label="Quitar fragmento">' + frag(byId[id]) + '</button></li>'
            : '<li><span class="ph">Posición ' + (i + 1) + '</span></li>';
        }
        var pool = P.fragments.filter(function (f) { return placed.indexOf(f.id) === -1; }).map(function (f) {
          return '<button class="fr" data-add="' + f.id + '">' + frag(f) + '</button>';
        }).join('');
        box.innerHTML =
          '<div class="pz-head"><b>' + esc(t.title) + '</b><button class="btn" data-pz="exit">Salir</button></div>' +
          '<p class="pz-p">' + esc(P.prompt) + '</p>' +
          '<ol class="slots">' + slots + '</ol>' +
          '<p class="pz-m" role="status">' + esc(msg) + '</p>' +
          '<div class="pool">' + pool + '</div>' +
          '<div class="pz-act"><button class="btn" data-pz="reset">Vaciar</button>' +
          '<button class="btn go" data-pz="check"' + (placed.length < n ? ' disabled' : '') + '>Reconstruir</button></div>';
      }
      function check() {
        var ok = 0;
        placed.forEach(function (id, i) { if (id === P.solution[i]) ok++; });
        if (ok === P.solution.length) { api.solved(); return; }
        var f = (Store.state.pinFails[failKey] || 0) + 1;
        Store.state.pinFails[failKey] = f; Store.save();
        Bus.emit('sfx', 'err');
        msg = 'Coherencia: ' + ok + ' de ' + P.solution.length + ' en su lugar.' + (f >= 2 ? ' Pista: ' + P.hint : '');
        draw();
      }
      box.onclick = function (e) {
        var b;
        if ((b = e.target.closest('[data-add]'))) { placed.push(b.getAttribute('data-add')); msg = ''; draw(); }
        else if ((b = e.target.closest('[data-un]'))) { placed.splice(placed.indexOf(b.getAttribute('data-un')), 1); msg = ''; draw(); }
        else if ((b = e.target.closest('[data-pz]'))) {
          var a = b.getAttribute('data-pz');
          if (a === 'exit') api.exit();
          else if (a === 'reset') { placed = []; msg = ''; draw(); }
          else if (a === 'check') check();
        }
      };
      draw();
    },

    /* puzzle "cross": marcar las afirmaciones de una declaración que los registros contradicen.
       Las marcas se guardan, así el jugador puede salir, releer la evidencia y volver. */
    cross: function (box, t, api) {
      var P = t.puzzle, msg = '';
      var pz = Store.state.pz = Store.state.pz || {};
      var marked = pz[t.id] = pz[t.id] || [];
      var failKey = 'puz_' + t.id;

      function draw() {
        var items = P.lines.map(function (l, i) {
          var on = marked.indexOf(l.id) !== -1;
          return '<li><button class="xl' + (on ? ' on' : '') + '" data-mark="' + l.id + '" aria-pressed="' + on + '">' +
            '<span class="xl-n">' + (i + 1) + '</span><span class="xl-x">' + esc(l.x) + '</span>' +
            (on ? '<span class="xl-tag">' + esc(P.tag || 'Contradice') + '</span>' : '') + '</button></li>';
        }).join('');
        box.innerHTML =
          '<div class="pz-head"><b>' + esc(t.title) + '</b><button class="btn" data-pz="exit">Salir</button></div>' +
          '<p class="pz-p">' + esc(P.prompt) + '</p>' +
          '<p class="pz-src"><b>Fuentes:</b> ' + esc(P.sources.join(' · ')) + '</p>' +
          '<ol class="xlist">' + items + '</ol>' +
          '<p class="pz-m" role="status">' + esc(msg) + '</p>' +
          '<div class="pz-act"><button class="btn" data-pz="reset">Limpiar</button>' +
          '<button class="btn go" data-pz="check"' + (marked.length ? '' : ' disabled') + '>Confirmar cruce</button></div>';
      }
      function check() {
        var sol = P.solution;
        var hits = marked.filter(function (id) { return sol.indexOf(id) !== -1; }).length;
        var wrong = marked.length - hits;
        if (hits === sol.length && !wrong) { api.solved(); return; }
        var f = (Store.state.pinFails[failKey] || 0) + 1;
        Store.state.pinFails[failKey] = f; Store.save();
        Bus.emit('sfx', 'err');
        msg = 'Análisis parcial: ' + hits + ' de ' + sol.length + ' confirmada' + (hits === 1 ? '' : 's') +
          (wrong ? ', ' + wrong + ' marca' + (wrong === 1 ? '' : 's') + ' sin respaldo en los registros.' : '.') +
          (f >= 2 ? ' Pista: ' + P.hint : '');
        draw();
      }
      box.onclick = function (e) {
        var b;
        if ((b = e.target.closest('[data-mark]'))) {
          var id = b.getAttribute('data-mark'), at = marked.indexOf(id);
          if (at === -1) marked.push(id); else marked.splice(at, 1);
          msg = ''; Store.save(); Bus.emit('sfx', 'key'); draw();
        } else if ((b = e.target.closest('[data-pz]'))) {
          var a = b.getAttribute('data-pz');
          if (a === 'exit') api.exit();
          else if (a === 'reset') { marked.length = 0; msg = ''; Store.save(); draw(); }
          else if (a === 'check') check();
        }
      };
      draw();
    },

    /* puzzle "locate": elegir, entre varios candidatos, el que encaja con todas las pistas (número, lugar, persona) */
    locate: function (box, t, api) {
      var P = t.puzzle, sel = null, msg = '';
      var failKey = 'puz_' + t.id;
      function draw() {
        box.innerHTML =
          '<div class="pz-head"><b>' + esc(t.title) + '</b><button class="btn" data-pz="exit">Salir</button></div>' +
          '<p class="pz-p">' + esc(P.prompt) + '</p>' +
          '<ul class="clues">' + P.clues.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' +
          '<ol class="xlist">' + P.options.map(function (o) {
            var on = sel === o.id;
            return '<li><button class="xl' + (on ? ' on' : '') + '" data-pick="' + o.id + '" aria-pressed="' + on + '">' +
              '<span class="xl-n">' + esc(o.tag || '·') + '</span><span class="xl-x"><b>' + esc(o.name) + '</b><br>' + esc(o.x) + '</span>' +
              (on ? '<span class="xl-tag">Elegido</span>' : '') + '</button></li>';
          }).join('') + '</ol>' +
          '<p class="pz-m" role="status">' + esc(msg) + '</p>' +
          '<div class="pz-act"><button class="btn go" data-pz="check"' + (sel ? '' : ' disabled') + '>' + esc(P.cta || 'Confirmar') + '</button></div>';
      }
      box.onclick = function (e) {
        var b;
        if ((b = e.target.closest('[data-pick]'))) { sel = b.getAttribute('data-pick'); msg = ''; Bus.emit('sfx', 'key'); draw(); }
        else if ((b = e.target.closest('[data-pz]'))) {
          var a = b.getAttribute('data-pz');
          if (a === 'exit') api.exit();
          else if (a === 'check') {
            if (sel === P.solution) { api.solved(); return; }
            var f = (Store.state.pinFails[failKey] || 0) + 1;
            Store.state.pinFails[failKey] = f; Store.save(); Bus.emit('sfx', 'err');
            var o = P.options.filter(function (x) { return x.id === sel; })[0];
            msg = (o && o.miss ? o.miss : 'No coincide con todas las pistas.') + (f >= 2 ? ' Pista: ' + P.hint : '');
            draw();
          }
        }
      };
      draw();
    },

    /* puzzle "tune": ajustar filtros hasta que la lectura se resuelva */
    tune: function (box, t, api) {
      var P = t.puzzle, vals = {};
      P.sliders.forEach(function (s) { vals[s.id] = s.start; });
      var c = P.crop, aspect = (c.w * P.ratio) / c.h;

      function dev(s) { return Math.abs(vals[s.id] - s.target); }
      function allOk() { return P.sliders.every(function (s) { return dev(s) <= P.tolerance; }); }
      function conf() {
        var m = 0;
        P.sliders.forEach(function (s) { m += Math.max(0, 1 - dev(s) / (P.tolerance * 4)); });
        return m / P.sliders.length;
      }
      function reading() {
        if (allOk()) return P.reading;
        var cf = conf(), out = '';
        for (var i = 0; i < P.reading.length; i++) {
          var ch = P.reading.charAt(i);
          out += ch === ' ' ? ' ' : (cf >= 0.3 + 0.45 * (i / P.reading.length) ? ch : '▒');
        }
        return out;
      }

      box.innerHTML =
        '<div class="pz-head"><b>' + esc(t.title) + '</b><button class="btn" data-pz="exit">Salir</button></div>' +
        '<p class="pz-p">' + esc(P.prompt) + '</p>' +
        '<div class="crop" style="aspect-ratio:' + aspect.toFixed(3) + '"><div class="crop-i" id="ci" style="background-image:url(' + esc(P.image) + ');' +
        'background-size:' + (100 / c.w).toFixed(1) + '% auto;background-position:' + (c.x / (1 - c.w) * 100).toFixed(1) + '% ' + (c.y / (1 - c.h) * 100).toFixed(1) + '%"></div></div>' +
        '<div class="reading" id="rd"></div>' +
        '<div class="meter"><i id="mt"></i></div><p class="mt-l" id="mtl"></p>' +
        P.sliders.map(function (s) {
          return '<label class="sl"><span>' + esc(s.label) + '</span><input type="range" min="0" max="100" value="' + s.start + '" data-s="' + s.id + '"></label>';
        }).join('') +
        '<p class="pz-m" id="pzm"></p>' +
        '<div class="pz-act"><button class="btn go" id="ok" data-pz="check" disabled>Confirmar lectura</button></div>';

      var ci = box.querySelector('#ci'), rd = box.querySelector('#rd'), mt = box.querySelector('#mt'),
          mtl = box.querySelector('#mtl'), okb = box.querySelector('#ok'), pm = box.querySelector('#pzm');

      function update() {
        var foco = vals.foco / 100, con = vals.contraste / 100, bri = vals.brillo / 100;
        ci.style.filter = 'blur(' + ((1 - foco) * 4).toFixed(1) + 'px) contrast(' + (0.7 + con * 1.1).toFixed(2) + ') brightness(' + (0.7 + bri * 1.0).toFixed(2) + ')';
        var cf = allOk() ? Math.max(conf(), 0.96) : Math.min(conf(), 0.94);
        mt.style.width = Math.round(cf * 100) + '%';
        mtl.textContent = 'Confianza ' + Math.round(cf * 100) + '%';
        rd.textContent = reading();
        rd.className = 'reading' + (allOk() ? ' hit' : '');
        okb.disabled = !allOk();
        pm.textContent = allOk() ? 'Lectura estable. Confirmala.' : '';
      }
      box.oninput = function (e) {
        var s = e.target.getAttribute && e.target.getAttribute('data-s');
        if (!s) return;
        vals[s] = +e.target.value; update();
      };
      box.onclick = function (e) {
        var b = e.target.closest('[data-pz]');
        if (!b) return;
        if (b.getAttribute('data-pz') === 'exit') api.exit();
        else if (b.getAttribute('data-pz') === 'check' && allOk()) api.solved();
      };
      update();
    }
  };

  /* ---------- app ---------- */
  OS.register({
    id: 'terminal', name: 'Terminal', hue: 'sage',
    locked: function () {
      return (Engine.has('terminal_unlocked') || Engine.has('unlocked_phone_joaco')) ? null : 'Herramientas de intrusión: se habilitan con la credencial de nivel 2.';
    },
    mount: function (el) {
      var T = Engine.data.terminal, timers = [], busy = false, inPuzzle = false;

      el.innerHTML =
        '<header class="app-h"><button class="back" data-act="close" aria-label="Volver al inicio">' + OS.icon('back') + '</button>' +
        '<div class="h-who"><h2>Terminal</h2><span>UCI-SH · nivel 2 provisorio</span></div></header>' +
        '<div class="shell" id="shell"><div class="term scroll" id="tOut" aria-live="polite"></div>' +
        '<div class="chips" id="tChips"></div>' +
        '<form class="term-in" id="tForm"><span class="ps">uci$</span>' +
        '<input id="tInput" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Comando">' +
        '<button type="submit" class="send" aria-label="Enviar">' + OS.icon('play') + '</button></form></div>' +
        '<div class="pz scroll" id="pz" hidden></div>';

      var out = el.querySelector('#tOut'), chipsEl = el.querySelector('#tChips'),
          form = el.querySelector('#tForm'), input = el.querySelector('#tInput'),
          shell = el.querySelector('#shell'), pz = el.querySelector('#pz');

      function print(lines, cls, done) {
        if (typeof lines === 'string') lines = [lines];
        busy = true;
        var i = 0, gap = Engine.pace() < 1 ? 50 : 130;
        (function next() {
          if (i >= lines.length) { busy = false; chips(); if (done) done(); return; }
          var d = document.createElement('div');
          d.className = 'ln ' + (cls || '');
          d.textContent = lines[i++];
          out.appendChild(d);
          out.scrollTop = out.scrollHeight;
          timers.push(setTimeout(next, gap));
        })();
      }

      function state(id) {
        var t = T.targets[id];
        if (t.onSolve && Engine.has(t.onSolve.flag)) return 'completado';
        if (t.locked || !([].concat(t.requires || []).every(Engine.has))) return 'sin acceso';
        return 'listo';
      }
      function toolLine(x) {
        var pad = (x.name + '          ').slice(0, 10);
        return pad + x.desc + (x.on ? '   [activa]' : '   [nivel ' + (x.lvl || 3) + ']');
      }
      function toolNames() {
        var n = [];
        Object.keys(T.targets).forEach(function (id) { if (n.indexOf(T.targets[id].tool) === -1) n.push(T.targets[id].tool); });
        return n;
      }
      function chips() {
        var c = ['ayuda', 'herramientas'].concat(toolNames());
        Object.keys(T.targets).forEach(function (id) { if (state(id) === 'listo') c.push(T.targets[id].tool + ' ' + id); });
        c.push('limpiar');
        chipsEl.innerHTML = c.map(function (x) { return '<button class="chip" data-cmd="' + x + '">' + x + '</button>'; }).join('');
      }

      function openPuzzle(id) {
        var t = T.targets[id]; t.id = id;
        inPuzzle = true; shell.hidden = true; pz.hidden = false;
        PUZZLES[t.puzzle.type](pz, t, {
          exit: function () { closePuzzle(); print('Operación cancelada.', 'warn'); },
          solved: function () {
            Bus.emit('sfx', 'ok');
            var s = t.onSolve;
            Engine.flag(s.flag);
            if (s.evidence) Engine.addEvidence(s.evidence);
            if (s.script) Engine.run(s.script);
            closePuzzle();
            print([t.done || 'Operación completada.', 'Contenido guardado en Evidencia: ' + Engine.data.evidence[s.evidence].title], 'ok');
          }
        });
      }
      function closePuzzle() { inPuzzle = false; pz.hidden = true; shell.hidden = false; pz.innerHTML = ''; out.scrollTop = out.scrollHeight; }

      function run(line) {
        var p = line.trim().split(/\s+/), c = (p[0] || '').toLowerCase(), arg = (p[1] || '').toLowerCase();
        if (!c) return;
        Bus.emit('sfx', 'key');
        var echo = document.createElement('div');
        echo.className = 'ln cmd'; echo.textContent = 'uci$ ' + line.trim();
        out.appendChild(echo);

        if (c === 'ayuda' || c === 'help') {
          var help = ['ayuda                lista de comandos', 'herramientas         herramientas de tu nivel'];
          T.tools.filter(function (x) { return x.on; }).forEach(function (x) {
            help.push(((x.name + ' <objetivo>' + '                ').slice(0, 20)) + ' ' + (x.short || x.desc));
          });
          help.push('limpiar              vacía la pantalla');
          print(help);
        } else if (c === 'herramientas' || c === 'tools') {
          print(T.tools.map(toolLine));
        } else if (c === 'limpiar' || c === 'clear') {
          out.innerHTML = '';
        } else if (toolNames().indexOf(c) !== -1) {
          var mine = Object.keys(T.targets).filter(function (id) { return T.targets[id].tool === c; });
          if (!arg) {
            var ls = mine.map(function (id) { return id + '   [' + state(id) + ']'; });
            print(['Objetivos disponibles:'].concat(ls).concat(['Uso: ' + c + ' <objetivo>']));
          } else if (mine.indexOf(arg) === -1) {
            print('Objetivo «' + arg + '» no encontrado. Escribí ' + c + ' para ver la lista.', 'err');
          } else {
            var st = state(arg), t = T.targets[arg];
            if (st === 'sin acceso') print('Acceso denegado. ' + t.denied, 'err');
            else if (st === 'completado') print('Operación ya completada. Revisá Evidencia.', 'warn');
            else print(t.log, '', function () { openPuzzle(arg); });
          }
        } else {
          print('Comando «' + c + '» no reconocido. Escribí ayuda.', 'err');
        }
      }

      el.addEventListener('click', function (e) {
        var t;
        if ((t = e.target.closest('[data-act="close"]'))) OS.close();
        else if ((t = e.target.closest('[data-cmd]')) && !busy) run(t.getAttribute('data-cmd'));
      });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (busy) return;
        var v = input.value; input.value = '';
        run(v);
      });

      print(T.intro, 'dim');
      chips();
      return { destroy: function () { timers.forEach(clearTimeout); } };
    }
  });
})();

</script>
<script>
/* App Casos: informe de cierre del último episodio terminado (resumen, decisiones, números, cabos sueltos).
   Todo el contenido sale del bloque "closing" del JSON del episodio. Si hay un episodio siguiente,
   ofrece pasar al día siguiente (es el jugador quien decide cuándo, porque el tiempo no corre con el juego cerrado). */
(function () {
  'use strict';
  var esc = OS.esc;

  OS.register({
    id: 'cases', name: 'Casos', hue: 'sand',
    locked: function () {
      return Engine.lastEnded() >= 0 ? null : 'El informe de cierre se habilita al terminar tu primer caso.';
    },
    mount: function (el) {
      var st = Store.state, idx = Engine.lastEnded(), E = Engine.episodes[idx], C = E.closing;

      function fails() {
        return Object.keys(st.pinFails).filter(E.owns).reduce(function (n, k) { return n + (st.pinFails[k] || 0); }, 0);
      }
      function stat(n, label) {
        return '<div class="stat"><b>' + esc(n) + '</b><span>' + esc(label) + '</span></div>';
      }
      function hit(o) { return [].concat(o.flags || o.flag).every(Engine.has); }
      function decision(d) {
        var o = d.options.filter(hit)[0];
        return '<div class="dec"><span class="dec-k">' + esc(d.label) + '</span><p>' + esc(o ? o.text : d.fallback) + '</p></div>';
      }

      var notes = st.notes.filter(function (id) { return E.noteIds.indexOf(id) !== -1; }).length;
      var evid = st.evidence.filter(function (id) { return E.evidenceIds.indexOf(id) !== -1; }).length;
      var canNext = idx === Engine.epIndex() && Engine.canAdvance();

      el.innerHTML =
        '<header class="app-h"><button class="back" data-act="close" aria-label="Volver al inicio">' + OS.icon('back') + '</button>' +
        '<div class="h-who"><h2>' + esc(C.title) + '</h2><span>' + esc(E.title) + '</span></div><span class="closed">Cerrado</span></header>' +
        '<div class="scroll">' +
        '<h3 class="grp">Resumen</h3>' + C.summary.map(function (p) { return '<p class="doc-p">' + esc(p) + '</p>'; }).join('') +
        '<h3 class="grp">Tus decisiones</h3>' + C.decisions.map(decision).join('') +
        '<h3 class="grp">En números</h3><div class="stats">' +
        stat(Engine.epMinutes(idx) + ' min', 'de investigación') +
        stat(notes + ' / ' + E.noteIds.length, 'pistas') +
        stat(evid + ' / ' + E.evidenceIds.length, 'evidencias') +
        stat(String(fails()), 'intentos fallidos') + '</div>' +
        '<h3 class="grp">Cabos sueltos</h3><ul class="loose">' + C.loose.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
        '<div class="next"><b>' + esc(C.next.title) + '</b><p>' + esc(C.next.text) + '</p>' +
        (canNext ? '<button class="btn go next-go" data-act="next">' + esc(C.next.cta || 'Pasar al día siguiente') + '</button>' : '') + '</div></div>';

      el.addEventListener('click', function (e) {
        if (e.target.closest('[data-act="close"]')) { OS.close(); return; }
        if (e.target.closest('[data-act="next"]') && Engine.advance()) {
          OS.close();
          Bus.emit('toast', Engine.ep().dayLabel || 'Nuevo caso');
        }
      });
      return {};
    }
  });
})();

</script>
<script>
/* App Mapa: plano del barrio con los lugares que el caso fue marcando.
   Se habilita con la bandera map_unlocked (credencial nivel 2 completa). Los puntos salen del bloque "map"
   de cada episodio: [{ id, name, x, y (0-100), note, if, ifNot }]. */
(function () {
  'use strict';
  var esc = OS.esc;
  var ALL = function (f) { return [].concat(f || []).every(function (x) { return Engine.has(x); }); };
  var NONE = function (f) { return ![].concat(f || []).some(function (x) { return Engine.has(x); }); };

  OS.register({
    id: 'map', name: 'Mapa', hue: "steel",
    locked: function () { return Engine.has('map_unlocked') ? null : 'Sin acceso. Tu credencial es de nivel 1.'; },
    mount: function (el) {
      var pins = (Engine.data.map || []).filter(function (p) { return ALL(p.if) && NONE(p.ifNot); });
      var sel = pins.length ? pins[pins.length - 1].id : null;

      function draw() {
        var cur = pins.filter(function (p) { return p.id === sel; })[0];
        var dots = pins.map(function (p) {
          return '<g class="pin' + (p.id === sel ? ' on' : '') + '" data-pin="' + p.id + '" tabindex="0">' +
            '<circle cx="' + p.x * 3 + '" cy="' + p.y * 2.2 + '" r="' + (p.id === sel ? 8 : 5.5) + '"/>' +
            '<text x="' + (p.x * 3) + '" y="' + (p.y * 2.2 - 11) + '" text-anchor="middle">' + esc(p.name) + '</text></g>';
        }).join('');
        el.innerHTML =
          '<header class="app-h"><button class="back" data-act="close" aria-label="Volver al inicio">' + OS.icon('back') + '</button>' +
          '<div class="h-who"><h2>Mapa</h2><span>Zona Norte · nivel 2</span></div></header>' +
          '<div class="scroll"><svg class="mapsvg" viewBox="0 0 300 220" role="img" aria-label="Plano del barrio">' +
          '<rect width="300" height="220" class="m-bg"/>' +
          '<path class="m-river" d="M0 168q60-24 120-6t180-30v88H0z"/>' +
          '<path class="m-rail" d="M0 60h300"/><path class="m-st" d="M60 0v220M150 0v220M236 0v220M0 118h300M0 30h300"/>' +
          dots + '</svg>' +
          (cur ? '<div class="mapnote"><b>' + esc(cur.name) + '</b><p>' + esc(cur.note || '') + '</p></div>' : '<p class="fine" style="padding:16px">Todavía no hay lugares marcados.</p>') +
          '<h3 class="grp">Lugares marcados</h3><ul class="loose">' +
          pins.map(function (p) { return '<li><button class="linkbtn" data-pin="' + p.id + '">' + esc(p.name) + '</button></li>'; }).join('') + '</ul></div>';
      }
      el.addEventListener('click', function (e) {
        var b;
        if (e.target.closest('[data-act="close"]')) { OS.close(); return; }
        if ((b = e.target.closest('[data-pin]'))) { sel = b.getAttribute('data-pin'); Bus.emit('sfx', 'key'); draw(); }
      });
      draw();
      return {};
    }
  });
})();

</script>
<script>
/* Ajustes: ritmo, guardado, reinicio y aviso de ficción. También hace de menú de pausa. */
(function () {
  'use strict';
  var esc = OS.esc;

  /* Apps bloqueadas: aparecen en el inicio pero todavía no se pueden abrir. */
  [
    { id: 'bank', name: 'Banco', locked: 'Requiere orden de la fiscalía.' }
  ].forEach(function (a) { a.hue = 'off'; OS.register(a); });

  OS.register({
    id: 'settings', name: 'Ajustes', hue: 'dim',
    mount: function (el) {
      var arm = false;

      function sw(k, st) {
        var on = !st.snd || st.snd[k] !== false;
        return '<button class="sw' + (on ? ' on' : '') + '" data-snd="' + k + '" role="switch" aria-checked="' + on + '" aria-label="Activar o desactivar"><i></i></button>';
      }

      function html() {
        var st = Store.state;
        return '<header class="app-h"><button class="back" data-act="close" aria-label="Volver al inicio">' + OS.icon('back') + '</button><h2>Ajustes</h2></header>' +
          '<div class="scroll">' +
          '<div class="set"><span>Usuario</span><b>' + esc(st.name) + '</b></div>' +
          '<div class="set col"><span>Dispositivo</span><b class="mono">Servicio U-114 · reasignado</b>' +
          '<p class="fine">Historial de usuarios anteriores: acceso restringido (credencial nivel 3).</p></div>' +
          '<div class="set col"><span>Ritmo de mensajes</span><div class="seg">' +
          '<button data-pace="real" class="' + (st.pace === 'real' ? 'on' : '') + '">Realista</button>' +
          '<button data-pace="agil" class="' + (st.pace === 'agil' ? 'on' : '') + '">Ágil</button></div></div>' +
          '<div class="set"><span>Ambiente de oficina</span>' + sw('amb', st) + '</div>' +
          '<div class="set"><span>Efectos y avisos</span>' + sw('fx', st) + '</div>' +
          '<div class="set col"><span>Volumen</span><input type="range" min="0" max="100" value="' + (st.vol == null ? 60 : st.vol) + '" id="vol" aria-label="Volumen"></div>' +
          '<div class="set"><span>Guardado</span><b>' + (Store.canSave ? 'Automático' : 'No disponible') + '</b></div>' +
          '<p class="fine">' + (Store.canSave
            ? 'El avance se guarda solo en este navegador. Si cerrás el juego, el tiempo se detiene.'
            : 'Este navegador no permite guardar. La partida se pierde al cerrar la página.') + '</p>' +
          '<div class="set col"><span>Aviso de contenido</span><p class="fine">Obra de ficción. Personas, lugares y organizaciones inventados. Trata crimen, narcotráfico y violencia sin escenas gráficas.</p></div>' +
          '<div class="set col"><span>Reiniciar partida</span>' +
          (arm ? '<p class="fine warn">Se borra todo el progreso y volvés a la configuración inicial.</p>' +
            '<div class="row-btns"><button class="btn danger" data-act="reset-ok">Sí, borrar todo</button><button class="btn" data-act="reset-no">Cancelar</button></div>'
            : '<button class="btn danger-o" data-act="reset">Reiniciar…</button>') + '</div>' +
          '<p class="fine ver">UCI · prototipo 0.3 · Temporada 1 completa</p></div>';
      }

      function render() { el.innerHTML = html(); }

      el.addEventListener('click', function (e) {
        var t = e.target.closest('[data-act],[data-pace],[data-snd]');
        if (!t) return;
        var a = t.getAttribute('data-act'), p = t.getAttribute('data-pace'), sk = t.getAttribute('data-snd');
        if (sk) {
          var sn = Store.state.snd = Object.assign({ amb: true, fx: true }, Store.state.snd);
          sn[sk] = !sn[sk]; Store.save(); Sound.unlock(); Sound.refresh(); render();
          Bus.emit('sfx', 'key'); return;
        }
        if (p) { Store.state.pace = p; Store.save(); render(); return; }
        if (a === 'close') OS.close();
        else if (a === 'reset') { arm = true; render(); }
        else if (a === 'reset-no') { arm = false; render(); }
        else if (a === 'reset-ok') { Store.reset(); location.reload(); }
      });
      el.addEventListener('input', function (e) {
        if (e.target.id !== 'vol') return;
        Store.state.vol = +e.target.value; Store.save(); Sound.refresh();
      });
      render();
      return {};
    }
  });

})();

</script>
<script>
  (function () {
    Store.load();
    OS.init();
    Engine.load('data/episodes.json').then(function () {
      function enter() { OS.showHome(); Engine.start(); OS.updateStatus(); Recap.maybe(); }
      if (Store.state.setup) enter(); else Setup.run(enter);
    }).catch(function (err) {
      console.error(err);
      document.getElementById('screen').innerHTML =
        '<p style="padding:32px 24px;color:var(--dim)">No se pudo cargar el caso. Volvé a abrir la página.</p>';
    });
  })();
</script>

</body>
</html>
